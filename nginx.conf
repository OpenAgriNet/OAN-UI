map $sent_http_content_type $ui_cache_control {
    default "";
    ~^text/html "no-store";
}

server {
    listen 8081;
    server_tokens off;
    autoindex off;
    root /usr/share/nginx/html;

    add_header Permissions-Policy "microphone=(self \"https://stagingchatbot.pmkisan.gov.in\")" always;
    # OpenSSL-backed Nginx generates a fresh 128-bit request ID for each response.
    add_header X-CSP-Nonce $request_id always;
    add_header Cache-Control $ui_cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The fixed hash allows Sonner 2.0.7's injected stylesheet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' 'sha256-CIxDM5jnsGiKqXs2v7NKCY5MzdR9gu6TtiMJrDw29AY='; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # A cached/304 body could carry a nonce from a different response.
        etag off;
        if_modified_since off;
        max_ranges 0;
        gzip_static off;
        sub_filter_once on;
        sub_filter '__CSP_NONCE__' '$request_id';
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}

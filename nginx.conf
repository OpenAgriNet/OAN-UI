server {
    listen 8081;

    # The official SHC report assets are public, but their upstream CORS header
    # is not valid for browser canvas export. Proxy only the report artwork
    # directory so PDF generation can load the same images from this origin.
    location ~ ^/shc-assets/(SHCLogo|green|yellow|orange|red|grey)\.png$ {
        rewrite ^/shc-assets/(.*)$ /files/report/$1 break;
        proxy_pass https://soilhealth.dac.gov.in;
        proxy_ssl_server_name on;
        proxy_set_header Host soilhealth.dac.gov.in;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /shc-assets/ {
        return 404;
    }
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
} 

name: PR Governance Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "Running PR governance check"
          echo "Title: ${PR_TITLE}"

          if [ "${PR_DRAFT}" = "true" ]; then
            echo "PR is still in draft. Move it to ready-for-review to merge."
            exit 1
          fi

          if [ -z "${PR_TITLE}" ]; then
            echo "PR title is required."
            exit 1
          fi

          echo "Governance checks passed"

  publish-required-status:
    name: publish-required-status
    runs-on: ubuntu-latest
    needs: governance
    if: always()
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish legacy required status context
        uses: actions/github-script@v7
        with:
          script: |
            const governanceResult = '${{ needs.governance.result }}';
            const success = governanceResult === 'success';
            const state = success ? 'success' : 'failure';
            const description = success
              ? 'Governance checks passed'
              : `Governance checks failed (${governanceResult})`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'PR Governance Gate / governance',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

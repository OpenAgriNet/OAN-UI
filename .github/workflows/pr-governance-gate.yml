name: PR Governance Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "Running PR governance check"
          echo "Title: ${PR_TITLE}"

          if [ "${PR_DRAFT}" = "true" ]; then
            echo "PR is still in draft. Move it to ready-for-review to merge."
            exit 1
          fi

          if [ -z "${PR_TITLE}" ]; then
            echo "PR title is required."
            exit 1
          fi

          echo "Governance checks passed"
